name: Generate Snake
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Priyanshusingh25
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#0891B2&color_dots=#e2e8f0,#0891B2,#7C3AED,#059669
            dist/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#0C1426,#22D3EE,#A78BFA,#10B981
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
